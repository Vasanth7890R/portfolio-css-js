<!DOCTYPE html>
<html>

<head>
    <title>Student Registration Form</title>
</head>

<body>

<h1>Student Registration Form</h1>

<p>Register Now</p>

<form>

<h2>Student Details</h2>

<label>Name:</label><br>
<input type="text" name="name"><br><br>

<label>Department:</label><br>
<input type="text" name="department"><br><br>

<label>College Name:</label><br>
<input type="text" name="college"><br><br>

<label>Year:</label><br>
<select name="year">
    <option>Select Year</option>
    <option>I Year</option>
    <option>II Year</option>
    <option>III Year</option>
</select><br><br>

<h2>Competition Details</h2>

<label>Select Competition:</label><br>
<select name="competition">
    <option>Select Competition</option>
    <option>Technical Quiz</option>
    <option>Coding Competition</option>
    <option>Dance</option>
    <option>Arts</option>
    <option>Photography</option>
    <option>Short Film</option>
    <option>Debugging Competition</option>
    <option>Project Presentation</option>
</select><br><br>

<h2>Contact Details</h2>

<label>Phone Number:</label><br>
<input type="tel" name="phone"><br><br>

<label>Email:</label><br>
<input type="email" name="email"><br>

<h2>Payment Details</h2>

<label>Payment Method:</label><br>

<input type="radio" name="payment"> UPI
<input type="radio" name="payment"> Cash

<br><br>

<label>Transaction ID:</label><br>
<input type="text" name="transaction"><br><br>

<label>Upload Payment Screenshot:</label><br>
<input type="file" name="payment"><br><br>

<input type="submit" value="Submit Registration">
<input type="reset" value="Clear">

</form>

</body>

</html>
